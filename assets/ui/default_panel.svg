<svg xmlns="http://www.w3.org/2000/svg" width="256" height="128" viewBox="0 0 256 128">
  <!-- RGE Default Panel — nine-slice safe zones: 16px margins all sides -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#253550"/>
      <stop offset="100%" stop-color="#1a2535"/>
    </linearGradient>
  </defs>
  <!-- Fill -->
  <rect width="256" height="128" rx="4" fill="url(#g)"/>
  <!-- Border -->
  <rect x="0.5" y="0.5" width="255" height="127" rx="4" fill="none" stroke="#2e4060" stroke-width="1"/>
  <!-- Corner guides (delete before use as NineSlice) -->
  <rect x="0" y="0" width="16" height="16" fill="none" stroke="#4a80c420" stroke-width="1" stroke-dasharray="2 2"/>
  <rect x="240" y="0" width="16" height="16" fill="none" stroke="#4a80c420" stroke-width="1" stroke-dasharray="2 2"/>
  <rect x="0" y="112" width="16" height="16" fill="none" stroke="#4a80c420" stroke-width="1" stroke-dasharray="2 2"/>
  <rect x="240" y="112" width="16" height="16" fill="none" stroke="#4a80c420" stroke-width="1" stroke-dasharray="2 2"/>
</svg>
